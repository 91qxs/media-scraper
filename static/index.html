<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>影视数据刮削器</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>

  <!-- 导航栏 -->
  <nav class="navbar">
    <div class="container">
      <h1 class="logo">🎬 影视刮削器</h1>
    </div>
  </nav>

  <!-- 主内容区 -->
  <main class="main">
    <div class="container">

      <!-- 搜索区域 -->
      <section class="search-section">
        <h2>输入影视名称进行数据刮削</h2>
        <div class="search-box">
          <input type="text" id="searchInput" placeholder="例如：肖申克的救赎" />
          <button id="scrapeBtn">🔍 刮削数据</button>
        </div>
      </section>

      <!-- 加载状态 -->
      <div id="loading" class="loading hidden">
        正在刮削数据，请稍候...
      </div>

      <!-- 结果展示区 -->
      <section id="result" class="result hidden">
        <div class="movie-poster">
          <img id="poster" src="" alt="电影海报" />
        </div>
        <div class="movie-info">
          <h2 id="title">电影标题</h2>
          <p><strong>年份：</strong><span id="year"></span></p>
          <p><strong>评分：</strong><span id="rating"></span> ⭐</p>
          <p><strong>类型：</strong><span id="genre"></span></p>
          <p><strong>导演：</strong><span id="director"></span></p>
          <p><strong>主演：</strong><span id="cast"></span></p>
          <p><strong>简介：</strong></p>
          <p id="plot" class="plot"></p>
        </div>
      </section>

      <!-- 提示信息 -->
      <div id="empty" class="empty hidden">
        请输入影视名称并点击“刮削数据”。
      </div>
      <div id="error" class="error hidden">
        未找到相关影视数据，请检查名称是否正确。
      </div>

    </div>
  </main>

  <!-- 页脚 -->
  <footer class="footer">
    <div class="container">
      <p>影视数据来源：The Movie Database (TMDB) 示例 | 仅供学习使用</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
